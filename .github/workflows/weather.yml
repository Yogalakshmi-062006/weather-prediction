name: Daily Paris Weather Email

on:
  # Runs every day at 06:00 UTC (GitHub cron always uses UTC)
  schedule:
    - cron: "0 6 * * *"

  # Adds a "Run workflow" button in the Actions tab for manual testing
  workflow_dispatch:

jobs:
  send-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # Replaces the three placeholder lines in weather.py with your GitHub
      # Secrets on the temporary runner only (never stored in Git).
      - name: Insert credentials into script
        env:
          SECRET_SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SECRET_SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SECRET_RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          test -n "$SECRET_SENDER_EMAIL"    || { echo "Missing secret: SENDER_EMAIL"; exit 1; }
          test -n "$SECRET_SENDER_PASSWORD" || { echo "Missing secret: SENDER_PASSWORD"; exit 1; }
          test -n "$SECRET_RECEIVER_EMAIL"  || { echo "Missing secret: RECEIVER_EMAIL"; exit 1; }

          sed -i "s|^SENDER_EMAIL = .*|SENDER_EMAIL = |"${SECRET_SENDER_EMAIL}|"|" weather.py
          sed -i "s|^SENDER_PASSWORD = .*|SENDER_PASSWORD = |"${SECRET_SENDER_PASSWORD}|"|" weather.py
          sed -i "s|^RECEIVER_EMAIL = .*|RECEIVER_EMAIL = |"${SECRET_RECEIVER_EMAIL}|"|" weather.py

      # Fails the run (red X) if the email was not actually sent
      - name: Run weather email script
        run: |
          python weather.py | tee run_output.txt
          grep -q "Email sent successfully" run_output.txt